name: pharmalens
description: "Smart prescription reading and medicine safety assistant."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any
  cupertino_icons: ^1.0.8

  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  path_provider: ^2.1.4

  string_similarity: ^2.0.0
  http: ^1.2.2
  url_launcher: ^6.3.0

  geolocator: ^13.0.1

  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  connectivity_plus: ^7.3.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/medicines/medicines.csv
    - assets/medicines/medicine_details.json
    - assets/medicines/lebanon_medicine_prices.csv
    - assets/medicines/lebanon_medicine_prices.json
    - assets/doctors/lebanon_doctors.csv